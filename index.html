<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket Tanks Classic Clone</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <!-- V7.0 Atmospheric Wallpaper Overlay -->
        <div id="main-menu-bg"></div>

        <canvas id="sky-canvas"></canvas>
        <canvas id="game-canvas"></canvas>

        <!-- Classic Main Menu -->
        <div id="main-menu" class="retro-panel active">
            <h1 style="color:var(--accent); font-size:2.5rem; text-transform:uppercase; letter-spacing:4px; text-shadow: 0 0 15px var(--accent); margin-bottom: 25px;">Pocket Tanks Web</h1>
            
            <div class="lobby-grid">
                <div class="setup-section">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 class="setup-title" style="margin:0;">PLAYER 1</h3>
                        <input type="color" id="p1-color" class="retro-color" value="#00ff00" title="Player 1 Color">
                    </div>
                    <div class="setup-group" style="margin-top:15px;">
                        <label>Name</label>
                        <input type="text" id="p1-name" class="retro-input" value="Player 1" style="width:100%;">
                    </div>
                </div>
                <div class="setup-section">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 class="setup-title" style="margin:0;">PLAYER 2</h3>
                        <input type="color" id="p2-color" class="retro-color" value="#ff0000" title="Player 2 Color">
                    </div>
                    <div class="setup-group" style="margin-top:15px;">
                        <label>Name</label>
                        <input type="text" id="p2-name" class="retro-input" value="Player 2" style="width:100%;">
                    </div>
                </div>
            </div>
            
            <div class="setup-section" style="max-width: 600px; margin: 0 auto 20px auto;">
                <div class="setup-group" style="justify-content: center; gap: 30px;">
                    <div>
                        <label style="margin-right: 10px;">Biome</label>
                        <select id="biome-select" class="retro-select">
                            <option value="Grasslands">Grasslands</option>
                            <option value="Desert">Desert</option>
                            <option value="Snow">Snow</option>
                        </select>
                    </div>
                    <div>
                        <label style="margin-right: 10px;">Weather</label>
                        <select id="weather-select" class="retro-select">
                            <option value="Clear">Clear</option>
                            <option value="Rain">Rain</option>
                            <option value="Snow">Snow</option>
                        </select>
                    </div>
                </div>
            </div>

            <button id="btn-start" class="retro-btn huge-btn">START BATTLE</button>
            <button id="btn-resume" class="retro-btn huge-btn hidden" style="margin-left: 15px; background: #64748b; border-color: #64748b;">RESUME</button>
        </div>

        <!-- Classic Game HUD -->
        <div id="hud" class="hidden">
            <div id="top-bar">
                <div class="player-stat">
                    <span id="lbl-p1-name">Player 1</span>
                    <div class="health-bar-container">
                        <div id="p1-health" class="health-fill" style="background:#00ff00;"></div>
                    </div>
                </div>
                <div style="display:flex; gap:20px;">
                    <span id="wind-hud">Wind: <span id="wind-value">0</span> <span id="wind-arrow">→</span></span>
                    <button id="btn-settings" class="retro-btn">MENU</button>
                </div>
                <div class="player-stat" style="text-align:right;">
                    <span id="lbl-p2-name">Player 2</span>
                    <div class="health-bar-container" style="float:right;">
                        <div id="p2-health" class="health-fill" style="background:#ff0000;"></div>
                    </div>
                </div>
            </div>

            <!-- Bottom Console -->
            <div id="bottom-console">
                <div id="p1-turn-indicator" class="turn-indicator hidden">PLAYER 1 TURN</div>
                
                <div class="hud-panel">
                    <label>ANGLE</label>
                    <div class="stepper-row">
                        <button id="btn-angle-down" class="retro-btn sq-btn">-</button>
                        <input type="number" id="angle-input" class="retro-num" min="0" max="360" value="45" readonly>
                        <button id="btn-angle-up" class="retro-btn sq-btn">+</button>
                    </div>
                </div>

                <div class="hud-panel">
                    <label>POWER</label>
                    <div class="stepper-row">
                        <button id="btn-power-down" class="retro-btn sq-btn">-</button>
                        <input type="number" id="power-input" class="retro-num" min="0" max="100" value="50" readonly>
                        <button id="btn-power-up" class="retro-btn sq-btn">+</button>
                    </div>
                </div>
                
                <div class="hud-panel center-panel" style="flex-direction: row; gap: 10px; align-items: stretch;">
                    <select id="weapon-select" class="retro-select" style="flex: 1;"></select>
                    <button id="btn-fire" class="round-icon-btn" title="Fire">
                        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="2" x2="12" y2="6"></line>
                            <line x1="12" y1="18" x2="12" y2="22"></line>
                            <line x1="2" y1="12" x2="6" y2="12"></line>
                            <line x1="18" y1="12" x2="22" y2="12"></line>
                            <circle cx="12" cy="12" r="2" fill="currentColor"></circle>
                        </svg>
                    </button>
                </div>

                <div class="hud-panel">
                    <label>FUEL: <span id="fuel-display">100</span>%</label>
                    <div style="display:flex; justify-content:center; gap:5px; margin-top:5px;">
                        <button id="btn-move-left" class="retro-btn">&lt;&lt;</button>
                        <button id="btn-move-right" class="retro-btn">&gt;&gt;</button>
                    </div>
                </div>

                <div id="p2-turn-indicator" class="turn-indicator hidden">PLAYER 2 TURN</div>
            </div>
            </div>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="retro-panel hidden">
            <h2 id="winner-text" style="font-size:3rem; margin-bottom:20px; color:#fff;">PLAYER WINS</h2>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button id="btn-rematch" class="retro-btn">REMATCH</button>
                <button id="btn-menu" class="retro-btn">MAIN MENU</button>
            </div>
        </div>

        <!-- Settings/Menu Modal -->
        <div id="settings-modal" class="modal-overlay hidden">
            <div class="retro-panel" style="width: 300px;">
                <h3 style="margin-bottom:20px;">GAME MENU</h3>
                <button id="btn-abort-match" class="retro-btn" style="width:100%; margin-bottom:10px; background:#c00;">QUIT TO MENU</button>
                <button id="modal-settings-close" class="retro-btn" style="width:100%;">RESUME BATTLE</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
