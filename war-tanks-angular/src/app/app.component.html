<div id="game-container">
  <!-- V7.0 Atmospheric Wallpaper Overlay -->
  <div id="main-menu-bg"></div>

  <canvas id="sky-canvas" #skyCanvas></canvas>
  <canvas id="game-canvas" #gameCanvas></canvas>

  <!-- Classic Main Menu -->
  <div id="main-menu" class="retro-panel active">
    <h1
      style="color:var(--accent); font-size:2.5rem; text-transform:uppercase; letter-spacing:4px; text-shadow: 0 0 15px var(--accent); margin-bottom: 25px;">
      War Tanks</h1>

    <!-- Game Mode Toggle -->
    <div class="mode-toggle-container">
      <button id="btn-mode-local" class="mode-btn" [class.active]="gameMode === 'local'"
        (click)="setGameMode('local')">
        <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="9" cy="7" r="3.5"/><circle cx="15" cy="7" r="3.5"/>
          <path d="M1 20c0-4 3.5-7 8-7 1.2 0 2.3.2 3.3.6M15 13c4.5 0 8 3 8 7"/>
        </svg>
        LOCAL 2P
      </button>
      <button id="btn-mode-ai" class="mode-btn" [class.active]="gameMode === 'ai'"
        (click)="setGameMode('ai')">
        <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/>
          <line x1="12" y1="1" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="1" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="23" y2="12"/>
        </svg>
        VS AI
      </button>
    </div>

    <div class="lobby-grid">
      <div class="setup-section">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 class="setup-title" style="margin:0;">PLAYER 1</h3>
          <input type="color" id="p1-color" class="retro-color" value="#00ff00" title="Player 1 Color">
        </div>
        <div class="setup-group" style="margin-top:15px;">
          <label>Name</label>
          <input type="text" id="p1-name" class="retro-input" value="Player 1" style="width:100%;">
        </div>
      </div>

      <!-- Player 2 (local mode) -->
      <div class="setup-section" *ngIf="gameMode === 'local'">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 class="setup-title" style="margin:0;">PLAYER 2</h3>
          <input type="color" id="p2-color" class="retro-color" value="#ff0000" title="Player 2 Color">
        </div>
        <div class="setup-group" style="margin-top:15px;">
          <label>Name</label>
          <input type="text" id="p2-name" class="retro-input" value="Player 2" style="width:100%;">
        </div>
      </div>

      <!-- AI Opponent (AI mode) -->
      <div class="setup-section ai-section" *ngIf="gameMode === 'ai'">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 class="setup-title" style="margin:0;">
            <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="4" y="4" width="16" height="12" rx="2"/>
              <circle cx="9" cy="10" r="1.5" fill="currentColor"/><circle cx="15" cy="10" r="1.5" fill="currentColor"/>
              <line x1="8" y1="16" x2="8" y2="19"/><line x1="16" y1="16" x2="16" y2="19"/>
              <line x1="6" y1="19" x2="10" y2="19"/><line x1="14" y1="19" x2="18" y2="19"/>
            </svg>
            AI OPPONENT
          </h3>
          <input type="color" id="p2-color-ai" class="retro-color" value="#ff0000" title="AI Tank Color">
        </div>
        <div class="setup-group" style="margin-top:15px;">
          <label>Difficulty</label>
          <div class="difficulty-selector">
            <button class="diff-btn" [class.active]="aiDifficulty === 'easy'"
              (click)="setAIDifficulty('easy')">
              <svg class="diff-rank" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10 14 L10 6"/>
                <path d="M6 10 L10 6 L14 10"/>
              </svg>
              <span>EASY</span>
            </button>
            <button class="diff-btn" [class.active]="aiDifficulty === 'medium'"
              (click)="setAIDifficulty('medium')">
              <svg class="diff-rank" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10 16 L10 4"/>
                <path d="M6 12 L10 8 L14 12"/>
                <path d="M6 8 L10 4 L14 8"/>
              </svg>
              <span>MEDIUM</span>
            </button>
            <button class="diff-btn" [class.active]="aiDifficulty === 'hard'"
              (click)="setAIDifficulty('hard')">
              <svg class="diff-rank" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10 18 L10 2"/>
                <path d="M6 14 L10 10 L14 14"/>
                <path d="M6 10 L10 6 L14 10"/>
                <path d="M6 6 L10 2 L14 6"/>
              </svg>
              <span>HARD</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="setup-section" style="max-width: 600px; margin: 0 auto 20px auto;">
      <div class="setup-group" style="justify-content: center; gap: 30px;">
        <div>
          <label style="margin-right: 10px;">Biome</label>
          <select id="biome-select" class="retro-select">
            <option value="Grasslands">Grasslands</option>
            <option value="Desert">Desert</option>
            <option value="Snow">Snow</option>
          </select>
        </div>
        <div>
          <label style="margin-right: 10px;">Weather</label>
          <select id="weather-select" class="retro-select">
            <option value="Clear">Clear</option>
            <option value="Rain">Rain</option>
            <option value="Snow">Snow</option>
          </select>
        </div>
      </div>
    </div>

    <button id="btn-start" class="retro-btn huge-btn" (click)="onStartBattle()">START BATTLE</button>
    <button id="btn-resume" class="retro-btn huge-btn hidden" (click)="onResume()"
      style="margin-left: 15px; background: #64748b; border-color: #64748b;">RESUME</button>
  </div>

  <!-- Game HUD -->
  <div id="hud" class="hidden">
    <div id="top-bar">
      <div class="player-stat">
        <span id="lbl-p1-name">Player 1</span>
        <div class="health-bar-container">
          <div id="p1-health" class="health-fill" style="background:#00ff00;"></div>
        </div>
      </div>
      <div style="display:flex; gap:20px; align-items:center;">
        <span id="wind-hud">Wind: <span id="wind-value">0</span> <span id="wind-arrow">→</span></span>
        <!-- AI Thinking Indicator -->
        <div id="ai-thinking" class="ai-thinking hidden">
          <svg class="radar-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="10" cy="10" r="8" opacity="0.3"/>
            <circle cx="10" cy="10" r="5" opacity="0.5"/>
            <circle cx="10" cy="10" r="2" fill="currentColor"/>
            <line x1="10" y1="10" x2="16" y2="4" class="radar-sweep"/>
          </svg>
          <span style="font-size:0.8rem; font-weight:700;">AI THINKING</span>
        </div>
        <button id="btn-settings" class="retro-btn">MENU</button>
      </div>
      <div class="player-stat" style="text-align:right;">
        <span id="lbl-p2-name">Player 2</span>
        <div class="health-bar-container" style="float:right;">
          <div id="p2-health" class="health-fill" style="background:#ff0000;"></div>
        </div>
      </div>
    </div>

    <!-- Bottom Console -->
    <div id="bottom-console">
      <div id="p1-turn-indicator" class="turn-indicator hidden">PLAYER 1 TURN</div>

      <div class="hud-panel">
        <label>ANGLE</label>
        <div class="stepper-row">
          <button id="btn-angle-down" class="retro-btn sq-btn">-</button>
          <input type="number" id="angle-input" #angleInput class="retro-num" min="0" max="360" value="45" readonly>
          <button id="btn-angle-up" class="retro-btn sq-btn">+</button>
        </div>
      </div>

      <div class="hud-panel">
        <label>POWER</label>
        <div class="stepper-row">
          <button id="btn-power-down" class="retro-btn sq-btn">-</button>
          <input type="number" id="power-input" #powerInput class="retro-num" min="0" max="100" value="50" readonly>
          <button id="btn-power-up" class="retro-btn sq-btn">+</button>
        </div>
      </div>

      <!-- Weapon Armory Button + Panel -->
      <div class="hud-panel center-panel" style="flex-direction: row; gap: 10px; align-items: stretch; position: relative;">
        <button id="btn-armory" class="armory-toggle-btn" (click)="toggleArmory()" title="Open Armory">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 2L4 7v6c0 5.5 3.4 10.7 8 12 4.6-1.3 8-6.5 8-12V7l-8-5z"/>
            <line x1="12" y1="8" x2="12" y2="14"/>
            <line x1="9" y1="11" x2="15" y2="11"/>
          </svg>
          <span id="current-weapon-name" class="weapon-label">Single Shot</span>
          <svg class="armory-chevron" [class.open]="armoryOpen" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 1 L6 6 L11 1"/>
          </svg>
        </button>
        <button id="btn-fire" class="round-icon-btn" title="Fire">
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="2" x2="12" y2="6"></line>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="2" y1="12" x2="6" y2="12"></line>
            <line x1="18" y1="12" x2="22" y2="12"></line>
            <circle cx="12" cy="12" r="2" fill="currentColor"></circle>
          </svg>
        </button>
      </div>

      <!-- Hidden select for internal state -->
      <select id="weapon-select" #weaponSelect class="retro-select" style="display:none;"></select>

      <div class="hud-panel fuel-panel" title="Fuel Remaining">
        <div style="display:flex; justify-content:center; align-items:center; margin-bottom:8px;">
          <svg class="fuel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <!-- Canister Outline -->
            <path d="M5 5h14v15a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5z" stroke="var(--text-dim)"/>
            <path d="M9 2h6v3H9z" stroke="var(--text-dim)"/>
            <path d="M5 10h14" stroke="var(--text-dim)" stroke-width="1" opacity="0.3"/>
            <path d="M5 15h14" stroke="var(--text-dim)" stroke-width="1" opacity="0.3"/>
            <!-- Inner Fill rect -->
            <rect id="fuel-rect-fill" x="5" y="5" width="14" height="15" fill="#4ade80" stroke="none" class="fuel-fill-anim"/>
          </svg>
          <span id="fuel-display" #fuelDisplay style="display:none;">100</span>
        </div>
        <div style="display:flex; justify-content:center; gap:8px;">
          <button id="btn-move-left" class="retro-btn move-btn" title="Move Left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="move-icon">
              <path d="M13 19L6 12l7-7" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M19 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
            </svg>
          </button>
          <button id="btn-move-right" class="retro-btn move-btn" title="Move Right">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="move-icon">
              <path d="M11 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M5 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="p2-turn-indicator" class="turn-indicator hidden">PLAYER 2 TURN</div>
    </div>

    <!-- Weapon Armory Panel (popup) -->
    <div id="armory-panel" class="armory-panel" [class.open]="armoryOpen" *ngIf="armoryOpen">
      <div class="armory-header">
        <svg class="armory-title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 2L4 7v6c0 5.5 3.4 10.7 8 12 4.6-1.3 8-6.5 8-12V7l-8-5z"/>
          <line x1="12" y1="8" x2="12" y2="14"/><line x1="9" y1="11" x2="15" y2="11"/>
        </svg>
        <span>ARMORY</span>
        <button class="armory-close" (click)="toggleArmory()">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="3" x2="13" y2="13"/><line x1="13" y1="3" x2="3" y2="13"/>
          </svg>
        </button>
      </div>
      <div class="armory-body">
        <div *ngFor="let cat of weaponCategories" class="armory-category">
          <div class="category-header">
            <svg class="cat-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" [innerHTML]="getCategoryIconPath(cat)"></svg>
            <span>{{cat}}</span>
          </div>
          <div class="category-weapons">
            <button *ngFor="let w of getWeaponsInCategory(cat); let i = index"
              class="weapon-row"
              [class.selected]="isWeaponSelected(w)"
              [class.biome-exclusive]="w.biome"
              (click)="selectWeapon(w)">
              <svg class="weapon-item-icon" viewBox="0 0 16 16" [style.color]="w.color" [style.filter]="'drop-shadow(0 0 4px ' + w.color + ')'" [innerHTML]="getWeaponIconPath(w.name)"></svg>
              <span class="weapon-name">{{w.name}}</span>
              <span class="weapon-dmg" *ngIf="w.damage > 0">{{w.damage}}</span>
              <span class="weapon-dmg utility" *ngIf="w.damage === 0">UTL</span>
              <svg *ngIf="w.biome" class="biome-badge" viewBox="0 0 12 12" fill="currentColor">
                <polygon points="6,0.5 7.5,4 11.5,4.5 8.5,7 9.5,11 6,9 2.5,11 3.5,7 0.5,4.5 4.5,4"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- End Screen -->
<div id="end-screen" class="retro-panel hidden">
  <h2 id="winner-text" style="font-size:3rem; margin-bottom:20px; color:#fff;">PLAYER WINS</h2>
  <div style="display:flex; gap:10px; justify-content:center;">
    <button id="btn-rematch" class="retro-btn">REMATCH</button>
    <button id="btn-menu" class="retro-btn">MAIN MENU</button>
  </div>
</div>

<!-- Settings/Menu Modal -->
<div id="settings-modal" class="modal-overlay hidden">
  <div class="retro-panel" style="width: 350px;">
    <h3 style="margin-bottom:20px;">GAME MENU</h3>
    <div class="setup-section" style="text-align:left;">
      <h4 class="setup-title" style="font-size:1rem; margin-bottom:10px;">SOUND</h4>
      <div class="setup-group">
        <label>Volume</label>
        <input type="range" id="volume-slider" min="0" max="100" value="80"
          style="flex:1; accent-color: var(--accent);">
      </div>
      <div class="setup-group">
        <label>Mute</label>
        <button id="btn-mute" class="retro-btn" style="padding:6px 16px; font-size:0.85rem;">ON</button>
      </div>
    </div>
    <button id="btn-abort-match" class="retro-btn" style="width:100%; margin-bottom:10px; background:#c00;">QUIT TO MENU</button>
    <button id="modal-settings-close" class="retro-btn" style="width:100%;">RESUME BATTLE</button>
  </div>
</div>

<!-- Custom Game Dialog -->
<div id="game-dialog" class="modal-overlay hidden">
  <div class="retro-panel" style="width: 400px; max-width: 90%;">
    <h3 id="game-dialog-title" style="margin-bottom:15px; color: var(--accent);">NOTICE</h3>
    <p id="game-dialog-message" style="margin-bottom:20px; color: var(--text-dim); font-size: 0.95rem;"></p>
    <button id="game-dialog-ok" class="retro-btn" style="width:100%;">OK</button>
  </div>
</div>

<!-- Custom Game Confirm Dialog -->
<div id="game-confirm" class="modal-overlay hidden">
  <div class="retro-panel" style="width: 400px; max-width: 90%;">
    <h3 id="game-confirm-title" style="margin-bottom:15px; color: var(--danger);">CONFIRM</h3>
    <p id="game-confirm-message" style="margin-bottom:20px; color: var(--text-dim); font-size: 0.95rem;"></p>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button id="game-confirm-yes" class="retro-btn" style="background: var(--danger); flex:1;">YES, LEAVE</button>
      <button id="game-confirm-no" class="retro-btn" style="flex:1;">CANCEL</button>
    </div>
  </div>
</div>
